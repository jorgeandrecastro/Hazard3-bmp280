
# Copyright (C) 2026 Jorge Andre Castro

[package]
edition       = "2024"
name          = "Hazard3-bmp280"
version       = "0.3.0"
authors       = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
description   = "Async no_std driver for the BMP280 pressure and temperature sensor, based on Hazard3 project."
documentation = "https://docs.rs/Hazard3-bmp280"
readme        = "README.md"
keywords      = ["Hazard3", "bmp280", "pressure", "no-std", "embedded"]
categories    = ["embedded", "no-std", "hardware-support"]
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/jorgeandrecastro/Hazard3-bmp280"

build        = false
autolib      = false
autobins     = false
autoexamples = false
autotests    = false
autobenches  = false

[lib]
name = "Hazard3_bmp280"
path = "src/lib.rs"

[features]
# ARM / Cortex-M: official Embassy backend
default = ["time-upstream", "sync-upstream"]
time-upstream = ["dep:embassy-time"]
sync-upstream = ["dep:embassy-sync"]

# RP2350 Hazard3 RISC-V: custom Embassy fork
time-riscv = ["dep:hazard3-time", "dep:hazard3-time-driver"]
sync-riscv = ["dep:hazard3-sync"]

# Optional f32 conversion methods
float = []

[dependencies]
embedded-hal-async = "1.0"

embassy-time = {
    version = "0.5",
    optional = true,
    default-features = false
}

hazard3-time= {
    package = "hazard3-time",
    version = "0.1",
    optional = true,
    default-features = false
}

hazard3-time-driver= {
    version = "0.1",
    optional = true,
    default-features = false
}

embassy-sync = {
    version = "0.8",
    optional = true,
    default-features = false
}

hazard3-sync= {
    package = "hazard3-sync",
    version = "0.1",
    optional = true,
    default-features = false
}

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
